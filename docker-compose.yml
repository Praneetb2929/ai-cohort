version: '3.8'

services:
  backend:
    build: .
    container_name: insurance_chatbot_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - chroma_data:/app/chroma_db
    restart: always

  frontend:
    build: .
    container_name: insurance_chatbot_frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    restart: always

volumes:
  chroma_data: